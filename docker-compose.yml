services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Repository root as the context so the image can embed docs/privacy/notices/
    # (see backend/Dockerfile); backend/Dockerfile.dockerignore limits what is sent.
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Not Development, so Scalar and the developer exception page stay off as in a
      # deployed app; not Production, so the console email backend is allowed and
      # confirmation links appear in `docker compose logs backend` (specs/002 plan D7).
      ASPNETCORE_ENVIRONMENT: Local
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: "${Jwt__Secret}"
      Jwt__ExpiryMinutes: "${Jwt__ExpiryMinutes}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      PRIVACY_LIFECYCLE_ENABLED: "${PRIVACY_LIFECYCLE_ENABLED:-false}"
      Email__Backend: "${Email__Backend:-console}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      APP_URL: "${APP_URL:-http://localhost:5173}"
      EMAIL_DAILY_CAP: "${EMAIL_DAILY_CAP:-90}"
      # Empty switches the bot check off (TurnstileOptions.cs); set together with the
      # frontend's TURNSTILE_SITE_KEY below.
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      TURNSTILE_HOSTNAMES: "${TURNSTILE_HOSTNAMES:-}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL}"
    # runtime-config.sh renders config.js from API_URL at container start and
    # refuses to start without it (the Azure app sets it in Bicep). Reusing
    # VITE_API_URL keeps one value in .env for the dev server and this container.
    environment:
      API_URL: "${VITE_API_URL}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
    ports:
      - "3000:80"

volumes:
  db_data: