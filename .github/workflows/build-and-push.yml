name: build-and-push

on:
  push:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gymnotebook-backend
          # The deploy workflow uses this full SHA tag to select the exact
          # backend image built for a merge commit.
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix={{branch}}-

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          # Repository root, so the image can embed docs/privacy/notices/
          # (see backend/Dockerfile and backend/Dockerfile.dockerignore).
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

  build-frontend:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gymnotebook-frontend
          # The backend and frontend must share the same immutable commit tag.
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix={{branch}}-

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
