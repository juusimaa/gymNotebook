server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No access log. This server only hands out the same static files to
    # everyone, so a per-request line (client address, user agent, path, time)
    # is identifying data with no operational use, and in production it would
    # sit in Docker's container log on the server for up to 30 days. The error
    # log stays at the image default (stderr), so real failures still show up.
    access_log off;

    # The router owns the URL: a direct load of /login or /change-password must
    # get index.html, not a 404, and the app then renders the right screen.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
