<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><!-- A ruled notebook page on the ink ground: paper, a gold margin rule, three ink lines (the last one short, a page part-filled). Shapes only, no text, so it renders the same everywhere; the page sits inside Android's maskable safe zone (radius 40%). --><rect width="512" height="512" fill="#201f1d"/><rect x="136" y="104" width="240" height="304" rx="10" fill="#f3f2f2"/><line x1="186" y1="104" x2="186" y2="408" stroke="#b68235" stroke-width="10"/><g stroke="#201f1d" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"><line x1="210" y1="190" x2="340" y2="190"/><line x1="210" y1="246" x2="340" y2="246"/><line x1="210" y1="302" x2="300" y2="302"/></g></svg>
